# Fly.io deployment.
#
# Why Fly: it gives one machine a dedicated IPv4 address in a region we pick.
# LinkedIn challenges shared datacenter addresses far more often, so a stable
# address in the same country as the account raises the success rate a lot.
#
# Set the secrets before the first deploy:
#   fly secrets set LI_AT=... JSESSIONID='ajax:...' API_KEYS=...
#
# Deploy with --ha=false. Fly creates two machines by default. This service
# must run one. The outbound rate limiter and the cache both live in process
# memory, so a second machine doubles the call rate toward LinkedIn and halves
# the cache hit rate. Set REDIS_URL and add a shared limiter before you scale.

app = "linkedin-profile-api"
primary_region = "sin"          # Singapore. Move this near your account's country.

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  LOG_LEVEL = "INFO"
  CACHE_TTL_S = "3600"
  OUTBOUND_RPS = "3.0"
  RATE_LIMIT_PER_MINUTE = "30"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Keep one machine awake. A suspended machine wakes on the first request,
  # and that wake time lands on whoever is watching the demo.
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
